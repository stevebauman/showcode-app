<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>DMG background generator</title>
        <style>
            body {
                font-family: -apple-system, system-ui, sans-serif;
                background: #111;
                color: #eee;
                margin: 0;
                padding: 24px;
            }
            h1 {
                font-size: 16px;
                font-weight: 500;
                margin: 0 0 16px;
            }
            .controls {
                display: flex;
                gap: 16px;
                align-items: center;
                margin-bottom: 16px;
                flex-wrap: wrap;
            }
            .control {
                display: flex;
                flex-direction: column;
                gap: 4px;
                font-size: 12px;
            }
            input[type="color"] {
                width: 60px;
                height: 40px;
                border: 1px solid #333;
                background: none;
                cursor: pointer;
            }
            button {
                padding: 10px 16px;
                background: #7c3aed;
                color: white;
                border: none;
                border-radius: 6px;
                font-size: 14px;
                cursor: pointer;
            }
            button:hover {
                background: #6d28d9;
            }
            canvas {
                width: 540px;
                height: 380px;
                border: 1px solid #333;
                display: block;
                image-rendering: -webkit-optimize-contrast;
            }
            .preset {
                background: #222;
                border: 1px solid #333;
                padding: 6px 10px;
                border-radius: 4px;
                font-size: 12px;
                cursor: pointer;
                color: #eee;
            }
            .preset:hover {
                background: #333;
            }
            .presets {
                display: flex;
                gap: 8px;
                margin-bottom: 16px;
                flex-wrap: wrap;
            }
            .hint {
                font-size: 12px;
                color: #888;
                margin-top: 12px;
            }
        </style>
    </head>
    <body>
        <h1>DMG background generator — exports 540×380 (@1x) and 1080×760 (@2x)</h1>

        <div class="presets">
            <button class="preset" data-a="#0f172a" data-b="#4c1d95" data-c="#0c4a6e">
                Dark moody
            </button>
            <button class="preset" data-a="#7c3aed" data-b="#d946ef" data-c="#0ea5e9">
                Vibrant brand
            </button>
            <button class="preset" data-a="#ede9fe" data-b="#fae8ff" data-c="#e0f2fe">
                Soft pastel
            </button>
            <button class="preset" data-a="#020617" data-b="#1e293b" data-c="#0f172a">
                Almost black
            </button>
            <button class="preset" data-a="#1e1b4b" data-b="#312e81" data-c="#1e3a8a">
                Indigo night
            </button>
        </div>

        <div class="controls">
            <div class="control">
                <label for="a">Top-left</label><input type="color" id="a" value="#0f172a" />
            </div>
            <div class="control">
                <label for="b">Middle</label><input type="color" id="b" value="#4c1d95" />
            </div>
            <div class="control">
                <label for="c">Bottom-right</label><input type="color" id="c" value="#0c4a6e" />
            </div>
            <div class="control">
                <label for="hl">Highlight</label><input type="color" id="hl" value="#ffffff" />
            </div>
            <div class="control">
                <label for="ho">Highlight opacity</label
                ><input type="range" id="ho" min="0" max="40" value="12" />
            </div>
            <button id="dl">Download both PNGs</button>
        </div>

        <canvas id="c2x" width="1080" height="760"></canvas>

        <p class="hint">
            Save both files to <code>build/dmg-background.png</code> and
            <code>build/dmg-background@2x.png</code>. macOS picks the @2x version automatically on
            retina displays; the DMG window sizes itself from the @1x file (540×380).
        </p>

        <script>
            const canvas = document.getElementById("c2x");
            const ctx = canvas.getContext("2d");
            const W = canvas.width;
            const H = canvas.height;

            const a = document.getElementById("a");
            const b = document.getElementById("b");
            const c = document.getElementById("c");
            const hl = document.getElementById("hl");
            const ho = document.getElementById("ho");

            function render() {
                const grad = ctx.createLinearGradient(0, 0, W, H);
                grad.addColorStop(0, a.value);
                grad.addColorStop(0.5, b.value);
                grad.addColorStop(1, c.value);
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, W, H);

                const opacity = parseInt(ho.value, 10) / 100;
                if (opacity > 0) {
                    const radial = ctx.createRadialGradient(
                        W * 0.25,
                        H * 0.25,
                        0,
                        W * 0.25,
                        H * 0.25,
                        W * 0.7,
                    );
                    radial.addColorStop(0, hexToRgba(hl.value, opacity));
                    radial.addColorStop(1, hexToRgba(hl.value, 0));
                    ctx.fillStyle = radial;
                    ctx.fillRect(0, 0, W, H);
                }
            }

            function hexToRgba(hex, alpha) {
                const r = parseInt(hex.slice(1, 3), 16);
                const g = parseInt(hex.slice(3, 5), 16);
                const bl = parseInt(hex.slice(5, 7), 16);
                return `rgba(${r}, ${g}, ${bl}, ${alpha})`;
            }

            [a, b, c, hl, ho].forEach((el) => el.addEventListener("input", render));

            document.querySelectorAll(".preset").forEach((btn) => {
                btn.addEventListener("click", () => {
                    a.value = btn.dataset.a;
                    b.value = btn.dataset.b;
                    c.value = btn.dataset.c;
                    render();
                });
            });

            function download(name, sourceCanvas) {
                const link = document.createElement("a");
                link.download = name;
                link.href = sourceCanvas.toDataURL("image/png");
                link.click();
            }

            document.getElementById("dl").addEventListener("click", () => {
                const small = document.createElement("canvas");
                small.width = 540;
                small.height = 380;
                const sctx = small.getContext("2d");
                sctx.imageSmoothingEnabled = true;
                sctx.imageSmoothingQuality = "high";
                sctx.drawImage(canvas, 0, 0, 540, 380);

                download("dmg-background.png", small);
                setTimeout(() => download("dmg-background@2x.png", canvas), 200);
            });

            render();
        </script>
    </body>
</html>
