name: build

on: workflow_dispatch

jobs:
    release:
        runs-on: ${{ matrix.os }}

        permissions:
            contents: write

        strategy:
            fail-fast: false
            matrix:
                os: [macos-latest, ubuntu-latest, windows-latest]

        steps:
            - name: Check out Git repository
              uses: actions/checkout@v5

            - name: Setup Node
              uses: actions/setup-node@v5
              with:
                  node-version: 22

            - uses: actions/cache@v5
              with:
                  path: "**/node_modules"
                  key: ${{ runner.os }}-modules-${{ hashFiles('**/package-lock.json') }}

            - name: Clear Showcode Folder (Unix)
              if: startsWith(matrix.os, 'ubuntu') || startsWith(matrix.os, 'macos')
              run: rm -rf ./showcode

            - name: Clear Showcode Folder (Windows)
              if: startsWith(matrix.os, 'windows')
              run: Remove-Item -Path "showcode" -Recurse -Force

            - name: Clone Showcode
              run: git submodule update --init --recursive

            - name: Install Showcode Dependencies
              run: (cd ./showcode && npm install)

            - name: Generate Showcode
              run: (cd ./showcode && npm run generate)
              env:
                  IS_DESKTOP: true
                  NODE_OPTIONS: --max-old-space-size=4096

            - name: Install App Dependencies
              run: npm install

            - name: Test App
              run: npm test

            - name: Import macOS signing certificate
              if: startsWith(matrix.os, 'macos')
              env:
                  CSC_LINK: ${{ secrets.CSC_LINK }}
                  CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
              run: |
                  SIGNING_CERTIFICATE_PATH="$RUNNER_TEMP/showcode-signing.p12"
                  SIGNING_KEYCHAIN_PATH="$RUNNER_TEMP/showcode-signing.keychain-db"
                  SIGNING_KEYCHAIN_PASSWORD=$(openssl rand -hex 32)
                  echo "::add-mask::$SIGNING_KEYCHAIN_PASSWORD"

                  printf '%s' "$CSC_LINK" | base64 --decode > "$SIGNING_CERTIFICATE_PATH"

                  security create-keychain -p "$SIGNING_KEYCHAIN_PASSWORD" "$SIGNING_KEYCHAIN_PATH"
                  security set-keychain-settings -lut 21600 "$SIGNING_KEYCHAIN_PATH"
                  security unlock-keychain -p "$SIGNING_KEYCHAIN_PASSWORD" "$SIGNING_KEYCHAIN_PATH"
                  security import "$SIGNING_CERTIFICATE_PATH" -P "$CSC_KEY_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild -k "$SIGNING_KEYCHAIN_PATH"
                  security set-key-partition-list -S apple-tool:,apple: -s -k "$SIGNING_KEYCHAIN_PASSWORD" "$SIGNING_KEYCHAIN_PATH"
                  security list-keychains -d user -s "$SIGNING_KEYCHAIN_PATH" "$HOME/Library/Keychains/login.keychain-db"

                  echo "CSC_KEYCHAIN=$SIGNING_KEYCHAIN_PATH" >> "$GITHUB_ENV"
                  rm "$SIGNING_CERTIFICATE_PATH"

            - name: Prepare for app notarization
              if: startsWith(matrix.os, 'macos')
              # Import Apple API key for app notarization on macOS
              run: |
                  mkdir -p ~/private_keys/
                  echo '${{ secrets.API_KEY }}' > ~/private_keys/AuthKey_${{ secrets.API_KEY_ID }}.p8

            - name: Build & Publish Application
              shell: bash
              run: |
                  if [[ "$RUNNER_OS" == "macOS" ]]; then
                      unset CSC_LINK
                      npx electron-builder --publish always --config.forceCodeSigning=true
                  else
                      npx electron-builder --publish always
                  fi
              env:
                  RELEASE: true
                  NODE_ENV: production
                  CSC_LINK: ${{ secrets.CSC_LINK }}
                  CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  APPLE_ID: ${{ secrets.APPLE_ID }}
                  APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
                  APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
                  APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
                  API_KEY_ID: ${{ secrets.API_KEY_ID }}
                  API_KEY_ISSUER_ID: ${{ secrets.API_KEY_ISSUER_ID }}
