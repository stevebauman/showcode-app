name: Build desktop release

on:
    workflow_dispatch:
        inputs:
            release_id:
                description: "Published release ID from stevebauman/showcode"
                required: true

permissions:
    contents: read

concurrency:
    group: desktop-release
    cancel-in-progress: false

jobs:
    prepare:
        runs-on: ubuntu-latest
        outputs:
            version: ${{ steps.prepare.outputs.version }}
            commit: ${{ steps.commit.outputs.sha }}
        steps:
            - uses: actions/create-github-app-token@v2
              id: app
              with:
                  app-id: ${{ vars.RELEASE_APP_ID }}
                  private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
                  owner: ${{ github.repository_owner }}
                  repositories: showcode-app
                  permission-contents: write
            - uses: actions/checkout@v5
              with:
                  ref: master
                  submodules: recursive
                  fetch-depth: 0
                  token: ${{ steps.app.outputs.token }}
            - uses: actions/setup-node@v5
              with:
                  node-version: 22
                  cache: npm
                  cache-dependency-path: |
                      package-lock.json
                      showcode/package-lock.json
            - name: Read the published Showcode release
              id: source
              env:
                  GH_TOKEN: ${{ github.token }}
                  RELEASE_ID: ${{ inputs.release_id }}
                  OWNER: ${{ github.repository_owner }}
              run: |
                  [[ "$RELEASE_ID" =~ ^[0-9]+$ ]] || { echo 'Use a numeric release ID.'; exit 1; }
                  mkdir -p .release
                  gh api "repos/$OWNER/showcode/releases/$RELEASE_ID" > .release/source.json
                  node scripts/releases/source.mjs .release/source.json .release/metadata.json
            - name: Pin the tagged renderer
              env:
                  SOURCE_TAG: ${{ steps.source.outputs.tag }}
              run: |
                  git rev-parse HEAD:showcode > .release/previous-ref
                  git -C showcode fetch origin master --tags
                  RENDERER_REF=$(git -C showcode rev-parse "refs/tags/$SOURCE_TAG^{commit}")
                  git -C showcode merge-base --is-ancestor "$RENDERER_REF" origin/master
                  git -C showcode checkout --detach "$RENDERER_REF"
                  printf '%s' "$RENDERER_REF" > .release/renderer-ref
            - name: Update desktop version
              id: prepare
              run: node scripts/releases/prepare.mjs "$(cat .release/previous-ref)" "$(cat .release/renderer-ref)"
            - name: Refuse to rebuild a published release
              uses: actions/github-script@v7
              env:
                  RELEASE_VERSION: ${{ steps.prepare.outputs.version }}
              with:
                  script: |
                      try {
                        const {data} = await github.rest.repos.getReleaseByTag({
                          ...context.repo, tag: `v${process.env.RELEASE_VERSION}`,
                        });
                        if (!data.draft) throw new Error('This version is already published. Prepare a new version.');
                      } catch (error) {
                        if (error.status !== 404) throw error;
                      }
            - name: Record the desktop release commit and tag
              id: commit
              env:
                  RELEASE_VERSION: ${{ steps.prepare.outputs.version }}
              run: |
                  git config user.name 'Showcode Release Bot'
                  git config user.email 'release-bot@users.noreply.github.com'
                  RELEASE_TAG="v$RELEASE_VERSION"
                  if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
                    git diff --exit-code "$RELEASE_TAG" -- package.json package-lock.json showcode "releases/$RELEASE_VERSION.json"
                    RELEASE_COMMIT=$(git rev-parse "$RELEASE_TAG^{commit}")
                  else
                    git add package.json package-lock.json showcode releases
                    if ! git diff --cached --quiet; then
                      git commit -m "Release Showcode $RELEASE_VERSION"
                    fi
                    RELEASE_COMMIT=$(git rev-parse HEAD)
                    git tag "$RELEASE_TAG" "$RELEASE_COMMIT"
                    git push --atomic origin HEAD:master "refs/tags/$RELEASE_TAG"
                  fi
                  echo "sha=$RELEASE_COMMIT" >> "$GITHUB_OUTPUT"
            - uses: actions/upload-artifact@v4
              with:
                  name: release-notes
                  path: |
                      .release/metadata.json
                      .release/notes.md
                  include-hidden-files: true

    build:
        needs: prepare
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                os: [macos-latest, ubuntu-latest, windows-latest]
        steps:
            - uses: actions/checkout@v5
              with:
                  ref: ${{ needs.prepare.outputs.commit }}
                  submodules: recursive
            - uses: actions/setup-node@v5
              with:
                  node-version: 22
                  cache: npm
                  cache-dependency-path: |
                      package-lock.json
                      showcode/package-lock.json
            - uses: actions/download-artifact@v4
              with:
                  name: release-notes
                  path: .release
            - name: Install dependencies
              shell: bash
              run: |
                  npm ci --prefix showcode
                  npm ci
            - name: Bundle the approved release notes
              run: node showcode/scripts/releases/import.mjs .release/metadata.json
            - name: Test renderer
              if: runner.os == 'Linux'
              working-directory: showcode
              run: |
                  npx nuxi prepare
                  npm run test:releases
                  npx vitest run
            - name: Generate renderer
              working-directory: showcode
              run: npm run generate
              env:
                  IS_DESKTOP: true
                  NODE_OPTIONS: --max-old-space-size=4096
            - name: Test desktop app
              run: npm test
            - name: Import macOS signing certificate
              if: startsWith(matrix.os, 'macos')
              env:
                  CSC_LINK: ${{ secrets.CSC_LINK }}
                  CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
              run: |
                  SIGNING_CERTIFICATE_PATH="$RUNNER_TEMP/showcode-signing.p12"
                  SIGNING_KEYCHAIN_PATH="$RUNNER_TEMP/showcode-signing.keychain-db"
                  SIGNING_KEYCHAIN_PASSWORD=$(openssl rand -hex 32)
                  echo "::add-mask::$SIGNING_KEYCHAIN_PASSWORD"

                  printf '%s' "$CSC_LINK" | base64 --decode > "$SIGNING_CERTIFICATE_PATH"

                  security create-keychain -p "$SIGNING_KEYCHAIN_PASSWORD" "$SIGNING_KEYCHAIN_PATH"
                  security set-keychain-settings -lut 21600 "$SIGNING_KEYCHAIN_PATH"
                  security unlock-keychain -p "$SIGNING_KEYCHAIN_PASSWORD" "$SIGNING_KEYCHAIN_PATH"
                  security import "$SIGNING_CERTIFICATE_PATH" -P "$CSC_KEY_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild -k "$SIGNING_KEYCHAIN_PATH"
                  security set-key-partition-list -S apple-tool:,apple: -s -k "$SIGNING_KEYCHAIN_PASSWORD" "$SIGNING_KEYCHAIN_PATH"
                  security list-keychains -d user -s "$SIGNING_KEYCHAIN_PATH" "$HOME/Library/Keychains/login.keychain-db"

                  echo "CSC_KEYCHAIN=$SIGNING_KEYCHAIN_PATH" >> "$GITHUB_ENV"
                  rm "$SIGNING_CERTIFICATE_PATH"

            - name: Package application without publishing
              shell: bash
              run: |
                  if [[ "$RUNNER_OS" == "macOS" ]]; then
                    unset CSC_LINK
                    npx electron-builder --publish never --config.forceCodeSigning=true -c.releaseInfo.releaseNotesFile=.release/notes.md
                  else
                    npx electron-builder --publish never -c.releaseInfo.releaseNotesFile=.release/notes.md
                  fi
              env:
                  RELEASE: true
                  NODE_ENV: production
                  CSC_LINK: ${{ secrets.CSC_LINK }}
                  CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
                  APPLE_ID: ${{ secrets.APPLE_ID }}
                  APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
                  APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
            - uses: actions/upload-artifact@v4
              with:
                  name: installers-${{ runner.os }}
                  if-no-files-found: error
                  compression-level: 0
                  path: |
                      dist/*.dmg
                      dist/*.zip
                      dist/*.exe
                      dist/*.AppImage
                      dist/*.blockmap
                      dist/latest*.yml

    publish:
        needs: [prepare, build]
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v5
              with:
                  ref: ${{ needs.prepare.outputs.commit }}
            - uses: actions/setup-node@v5
              with:
                  node-version: 22
                  cache: npm
            - run: npm ci --ignore-scripts
            - uses: actions/download-artifact@v4
              with:
                  pattern: installers-*
                  path: dist
                  merge-multiple: true
            - uses: actions/download-artifact@v4
              with:
                  name: release-notes
                  path: .release
            - name: Verify all installers and updater manifests
              env:
                  RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
              run: node scripts/releases/artifacts.mjs dist "$RELEASE_VERSION"
            - name: Create or update the draft release
              uses: actions/github-script@v7
              env:
                  RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
                  RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
              with:
                  script: |
                      const fs = require('node:fs');
                      const notes = fs.readFileSync('.release/notes.md', 'utf8');
                      const tag = `v${process.env.RELEASE_VERSION}`;
                      let release;
                      try {
                        release = (await github.rest.repos.getReleaseByTag({...context.repo, tag})).data;
                      } catch (error) {
                        if (error.status !== 404) throw error;
                      }
                      if (release && !release.draft) throw new Error('Refusing to modify a published release.');
                      const options = {
                        ...context.repo, name: `Showcode ${process.env.RELEASE_VERSION}`,
                        body: notes, draft: true, prerelease: false,
                      };
                      if (release) await github.rest.repos.updateRelease({...options, release_id: release.id});
                      else await github.rest.repos.createRelease({
                        ...options, tag_name: tag, target_commitish: process.env.RELEASE_COMMIT,
                      });
            - name: Upload verified assets
              env:
                  GH_TOKEN: ${{ github.token }}
                  RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
              run: |
                  gh release upload "v$RELEASE_VERSION" dist/* --clobber
            - uses: actions/create-github-app-token@v2
              id: web-app
              with:
                  app-id: ${{ vars.RELEASE_APP_ID }}
                  private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
                  owner: ${{ github.repository_owner }}
                  repositories: showcode
                  permission-contents: write
            - uses: actions/checkout@v5
              with:
                  repository: ${{ github.repository_owner }}/showcode
                  ref: master
                  path: .release/web-sync
                  token: ${{ steps.web-app.outputs.token }}
            - name: Sync the web changelog
              env:
                  RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
              run: |
                  npm ci --prefix .release/web-sync
                  node .release/web-sync/scripts/releases/import.mjs .release/metadata.json
                  npm run release:check --prefix .release/web-sync
                  cd .release/web-sync
                  git config user.name 'Showcode Release Bot'
                  git config user.email 'release-bot@users.noreply.github.com'
                  git add app/content/releases package.json package-lock.json
                  if ! git diff --cached --quiet; then
                    git commit -m "Sync Showcode $RELEASE_VERSION release notes"
                    git push origin HEAD:master
                  fi
            - name: Publish the verified desktop release
              env:
                  GH_TOKEN: ${{ github.token }}
                  RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
              run: |
                  gh release edit "v$RELEASE_VERSION" --draft=false --latest
                  printf '## Showcode %s published\n\nAll platform installers and updater manifests passed validation.\n' "$RELEASE_VERSION" >> "$GITHUB_STEP_SUMMARY"
